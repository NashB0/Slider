name: slider
description: App para revisar y ordenar fotos deslizando.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  photo_manager: ^3.6.0
  flutter_card_swiper: ^7.0.0
  shared_preferences: ^2.3.2
  video_player: ^2.9.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "icon.png"
  adaptive_icon_background: "#1B1F2A"
  adaptive_icon_foreground: "icon_foreground.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
